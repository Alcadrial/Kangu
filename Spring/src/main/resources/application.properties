spring.application.name=Kangu

spring.kafka.bootstrap-servers=${KAFKA_URL:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
logging.level.org.apache.kafka=OFF

logging.level.org.springframework.security=DEBUG
spring.web.error.include-stacktrace=never

spring.datasource.url=jdbc:oracle:thin:@//${DB_URL:localhost:1521}/FREEPDB1
spring.datasource.username=${DB_USERNAME:spring}
spring.datasource.password=${DB_PASSWORD:password}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:localhost:9093}/realms/${KEYCLOAK_REALM_NAME:kangu}
