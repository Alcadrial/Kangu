
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "spring"
    metrics_path: "/actuator"
    static_configs:
      - targets: ["spring:8080"]
  - job_name: "oracledb"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["db:1521"]
  - job_name: "kafka"
    static_configs:
      - targets: ["broker:9092"]
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+):\d+'
        target_label: instance
        replacement: '${1}'