@let chatPreview = this.chatPreview();
@let user = this.userData();
<div class="size-full flex flex-col">
    <div class="px-4 py-1 flex flex-col text-md">
        <div class="w-full flex flex-row justify-between items-center">
            <span class="truncate">{{ chatPreview.username }}</span>
            <div [title]="`Status ${user?.onlineStatus ?? 'unknown'}`" class="flex flex-row items-center gap-2">
                <span class="text-xs">{{ user?.onlineStatus ?? "" }}</span>
                <div [class]="`size-2 rounded-full ${statusColor()}`"></div>
            </div>
        </div>
        <div class="p-2 flex flex-row justify-between gap-2 text-xs text-neutral-300">
            <span class=" max-w-[50%] truncate">{{ chatPreview.lastMessage }}</span>
            <span class="text-2xs truncate">{{ chatPreview.messageTimestamp | pastTime }}</span>
        </div>

    </div>
</div>
