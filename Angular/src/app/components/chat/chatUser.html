
<div class="size-full flex flex-col">
    <div class="px-4 py-1 flex flex-col justify-center items-center text-md">
        @if (userData(); as user) {
            <div class="w-full flex flex-row justify-between items-center">
                <span class="truncate">{{ user.username }}</span>
                <div [title]="`Status ${user.onlineStatus}`" class="flex flex-row items-center gap-2">
                    <span class="text-xs">{{ user.onlineStatus }}</span>
                    <div [class]="`size-2 rounded-full ${statusColor()}`"></div>
                </div>
            </div>
            <div class="w-full p-2 flex flex-row justify-between gap-2 text-xs text-neutral-300">
                <span class=" max-w-[50%] truncate">{{ user.email }}</span>
                <span title="Last access" class="text-2xs truncate">{{ user.lastAccessTime | pastTime }}</span>
            </div>
        }
        @else {
            <app-spinner></app-spinner>
        }
    </div>
</div>
