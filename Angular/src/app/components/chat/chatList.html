<div class="size-full flex flex-col border-r border-surface-700">
    <chat-user class="h-16"></chat-user>
    <separator w="w-[95%]"></separator>
    @if (chats(); as chats) {
        <div class="size-full flex flex-col justify-between overflow-y-auto">
            <div class="h-0 grow w-full p-2 flex flex-col divide-y">
                @for (chat of chats; track chat.username) {
                    <chat-list-item [chatPreview]="chat" class="last:border-b hover:bg-surface-800 border-surface-600 cursor-pointer" (click)="openChat(chat.username)" />
                }
            </div>
            <separator w="w-[95%]"></separator>
            <button class="inlinec h-10 sticky bottom-0 flex flex-row justify-between items-center gap-1 fill" (click)="isCreateConversationModalOpen.set(true)">
                <span class="truncate">New conversation</span>
                <svg lucidePlus></svg>
            </button>

            <app-dialog
                [title]="'Start a new conversation'" 
                [(open)]="isCreateConversationModalOpen"
                (openChange)="!$event && onCloseDialog()"
            >
                <form class="w-full flex flex-col items-end gap-1" (submit)="createNewConversation($event)">
                    <app-input 
                        label="User"
                        placeholder="username"
                        [autofocus]="true"
                        [formField]="newChatForm"
                    ></app-input>

                    <button class="primary" [disabled]="!newChatForm().value()">
                        Start chatting
                    </button>
                </form>
            </app-dialog>
            
            <separator w="w-[95%]" color="bg-surface-600"></separator>
            <button class="inlinec destructive h-10 sticky bottom-0 flex flex-row justify-between items-center gap-1 fill" (click)="doLogout()">
                <span class="truncate">Logout</span>
                <svg lucideLogOut></svg>
            </button>
        </div>
    }
    @else if (error(); as error) {
        <div>
            {{ error }}
            <button>
                Try again
            </button>
        </div>
    }
    @else {
        <app-spinner size="md"></app-spinner>
    }
</div>
