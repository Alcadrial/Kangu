
<div class="size-full flex flex-row">
    <chat-list
        class="h-full w-max-60 w-min-20 w-[30%]"
        [chats]="chats()"
        [error]="error()"
        (logout)="logout()"
    />
    <chat-messages
        class="w-0 grow"
        [chat]="currentChat()"
        [messageDraft]="messageDraft()"
        [isLoadingMessages]="isLoadingMessages()"
        [isSendingMessage]="isSendingMessage()"
        (sendMessage)="sendMessage($event)"
    />
</div>
