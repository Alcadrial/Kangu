<div class="size-full flex items-left bg-[url(/loginWallpaper.png)] bg-cover">
    <form (submit)="onSubmit($event)" class="flex flex-col items-center justify-center gap-4 w-100 p-6 bg-neutral-900/80">
        <h1 class="text-amber-400 text-4xl">Kangu Login</h1>
        <div class="pb-2 pt-8 flex flex-col gap-2">
            <app-input 
                class="w-80"
                label="Username"
                type="text"
                autofocus
                [formField]="loginForm.username"
                placeholder="john"
            ></app-input>
            <app-input 
                class="w-80"
                label="Password"
                type="password"
                [formField]="loginForm.password"
                placeholder="***"
            ></app-input>
        </div>
        @if (error(); as error) {
            <span class="text-red-600 text-sm">{{error}}</span>
        }
        <div class="grid grid-cols-2 gap-4">
            <label class="group p-1 flex flex-row gap-1 items-center cursor-pointer">
                <input
                    class="cursor-pointer"
                    type="checkbox"
                    [formField]="loginForm.rememberMe"
                />
                <span class="text-xs text-neutral-300 group-has-checked:text-neutral-100">Remember me</span>
            </label>
            <button
                type="submit"
                [disabled]="loginForm().invalid()"
                class="w-25 text-white border border-neutral-700 bg-neutral-800 enabled:cursor-pointer disabled:text-neutral-600 disabled:border-neutral-800 disabled:bg-neutral-900"
            >
                Log in
            </button>
        </div>
        <a class="text-sm text-neutral-400" routerLink="/register">Create a new account</a>
        <a class="text-xs text-neutral-500" i18n routerLink="/">Back to Home</a>
    </form>
</div>
