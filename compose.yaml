services:
  db:
    image: container-registry.oracle.com/database/free:${DB_VERSION}
    ports:
      - "1521:1521"
    networks:
      - network
    volumes:
      - db-data:/opt/oracle/oradata
  broker:
    image: apache/kafka:${KAFKA_VERSION}
    environment:
      KAFKA_LOG4J_LOGGERS: org.apache.kafka.clients=WARN,org.apache.kafka.controller=WARN
#      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false
#      KAFKA_OPTS: -javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/opt/jmx_exporter/config.yml
    ports:
      - "9092:9092"
    networks:
      - network
    volumes:
      - broker-data:/data
      - ./kafka/kafka-jmx-config.yml:/opt/jmx_exporter/config.yml
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    ports:
      - "9090:9090"
    networks:
      - network
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - network
    depends_on:
      - prometheus
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasources
      - grafana-storage:/var/lib/grafana

