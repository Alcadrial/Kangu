services:
  db:
    image: container-registry.oracle.com/database/free:${DB_VERSION}
    ports:
      - "1521:1521"
    networks:
      - network
    volumes:
      - db-data:/opt/oracle/oradata
  broker:
    image: apache/kafka:${KAFKA_VERSION}
    environment:
      KAFKA_LOG4J_LOGGERS: org.apache.kafka.clients=DEBUG,org.apache.kafka.controller=TRACE
#      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false
#      KAFKA_OPTS: -javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/opt/jmx_exporter/config.yml
    ports:
      - "9092:9092"
    networks:
      - network
    volumes:
      - broker-data:/data
      - ./kafka/kafka-jmx-config.yml:/opt/jmx_exporter/config.yml
  keycloak:
    build:
      context: ./keycloak
      dockerfile: Containerfile
      args:
        DB_VERSION: ${DB_VERSION}
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION}
        DB_KEYCLOAK_PASSWORD: ${DB_KEYCLOAK_PASSWORD}
    ports:
      - "9093:8080"
      - "9091:9000"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: tadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: tadmin
    command:
      - start-dev
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    ports:
      - "9090:9090"
    networks:
      - network
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - network
    depends_on:
      - prometheus
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/ds:/var/lib/custom/dashboards
      - grafana-storage:/var/lib/grafana
  spring:
    build:
      context: ./Spring
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: db:1521
      DB_USERNAME: spring
      DB_PASSWORD: ${DB_SPRING_PASSWORD}
      KAFKA_URL: broker:9092
      KEYCLOAK_URL: keycloak:9093
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
#  front-end:
#    build:
#      context: ./Angular
#      dockerfile: Containerfile
#  proxy:
#    image: nginx:${NGINX_VERSION}
#    ports:
#      - "${PUBLIC_PORT}:80"
#    volumes:
#      - ./nginx/templates:/etc/nginx/templates
#    networks:
#      - network
#    environment:
#      - SPRING_HOST=http://spring
#      - SPRING_PORT=8080
#      - FRONT_END_HOST=http://front-end
#      - FRONT_END_PORT=4200

networks:
  network:

secrets:
  oracle_pwd:
    external: true

volumes:
  db-data:
  broker-data:
  prometheus-data:
  grafana-storage: